[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speccompact"
version = "0.1.0"
description = "Slot-parallel semantic speculative context compaction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["requests>=2.31", "pyyaml>=6"]

[project.scripts]
speccompact = "entrypoint:main"

[dependency-groups]
inference = ["transformers>=5.11,<6"]
training = ["llamafactory", "wandb>=0.23"]

[tool.uv]
conflicts = [[{group = "inference"}, {group = "training"}]]

[tool.uv.sources]
llamafactory = {path = "src/LlamaFactory", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/compaction", "src/hparam", "src/data", "src/training", "src/utils"]

[tool.hatch.build.targets.wheel.force-include]
"src/entrypoint.py" = "entrypoint.py"
