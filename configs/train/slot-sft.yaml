# One drafter recipe; choose the target-specific tokenized dataset separately.
model_name_or_path: Qwen/Qwen3-0.6B
tokenized_path: data/slot-sft
output_dir: outputs/slot-sft
run_name: slot-sft

lora_rank: 16
lora_alpha: 32
lora_dropout: 0.0
learning_rate: 0.0001
num_train_epochs: 1.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 1.0

cutoff_len: 16384
bf16: true
flash_attn: fa3
disable_gradient_checkpointing: true
seed: 42
dataloader_num_workers: 4
per_device_eval_batch_size: 4
eval_steps: 200
logging_steps: 10
report_to: none
